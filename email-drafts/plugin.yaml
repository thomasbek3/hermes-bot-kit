manifest_version: 2
api_version: 1
name: email-drafts
version: 1.0.0
description: Bots write email as drafts; you send them from a card in the chat (through Composio by default, or Gmail or SMTP), with per-bot allowed-recipient rules
requires_hermes: ">=0.23.0"
author: Thomas Bekkers
license: MIT
homepage: https://github.com/thomasbek3/hermes-bot-kit
tags: [email, drafts, approval, composio, gmail, smtp, desktop]
provides_tools:
  - email_draft_create
  - email_draft_update
  - email_draft_status
# Composio (the default sender) runs the `composio` CLI that is installed and
# logged in on the bot's machine; the CLI keeps its own login. A Composio user
# API key is optional and, when set for the profile, is read with
# agent.secret_scope.get_secret and passed only to that child process.
# The Gmail sender's client is the user's own Google Cloud "Desktop app" OAuth client.
# Hermes runs the sign-in (`hermes auth add email-drafts:google`), stores and
# refreshes the grant, and attaches it to requests made through
# credentialed_provider_request. gmail.send is the only scope: the plugin can
# send mail as the signed-in account and cannot read the mailbox.
optional_env:
  - name: COMPOSIO_USER_API_KEY
    description: "Optional Composio user API key for this profile (the composio CLI's own login is used when unset)"
    url: "https://platform.composio.dev"
    secret: true
  - name: EMAIL_DRAFTS_GOOGLE_CLIENT_ID
    description: "Client ID of your own Google Cloud OAuth client (Desktop app) for Gmail sending"
    url: "https://console.cloud.google.com/apis/credentials"
  - name: EMAIL_DRAFTS_GOOGLE_CLIENT_SECRET
    description: "Client secret of that OAuth client"
    secret: true
  - name: EMAIL_DRAFTS_SMTP_PASSWORD
    description: "SMTP password (or app password) when the sender is smtp"
    secret: true
oauth:
  - id: google
    authorize_url: https://accounts.google.com/o/oauth2/v2/auth
    token_url: https://oauth2.googleapis.com/token
    scopes:
      - https://www.googleapis.com/auth/gmail.send
    client_id_env: EMAIL_DRAFTS_GOOGLE_CLIENT_ID
    client_secret_env: EMAIL_DRAFTS_GOOGLE_CLIENT_SECRET
    hosts: [gmail.googleapis.com]
    authorize_params: {access_type: offline, prompt: consent}
config_schema:
  sender:
    type: str
    choices: [composio, gmail, smtp]
    default: composio
    label: "Send with"
    description: "composio (default): the Gmail account connected in Composio, through the composio CLI logged in on the bot's machine. gmail: the Google account signed in with `hermes auth add email-drafts:google`. smtp: the server below."
  from_address:
    type: str
    default: ""
    label: "From address"
    description: "The address drafts are sent from. With Composio it must be the connected Gmail account's address (checked before every send). With gmail, the signed-in account or one of its verified send-as addresses."
  from_name:
    type: str
    default: ""
    label: "From name"
    description: "Display name shown to recipients (optional)."
  signature:
    type: str
    default: ""
    label: "Signature"
    description: "Plain-text signature added under the body of every email this bot sends. Use \\n for new lines."
  attachment_dirs:
    type: list
    default: []
    label: "Extra attachment folders"
    description: "Absolute folders whose files may be attached, besides the bot's working directory (which never counts when it is your home folder)."
  composio_account:
    type: str
    default: ""
    label: "Composio account"
    description: "Which Gmail account connected in Composio this bot sends from: its alias, word id or connected-account id (see `composio connections list --toolkit gmail`). Empty: the CLI's default Gmail account."
  composio_cli:
    type: str
    default: ""
    label: "Composio CLI"
    description: "Absolute path of the composio CLI on the bot's machine. Empty: `composio` on PATH, then ~/.local/bin/composio and ~/.composio/composio."
  composio_user_api_key:
    type: secret
    env: COMPOSIO_USER_API_KEY
    label: "Composio user API key (optional)"
    description: "Only when this profile should use a different Composio login than the CLI's. Read with the profile's secret scope and passed to the composio CLI it runs."
  google_client_id:
    type: secret
    env: EMAIL_DRAFTS_GOOGLE_CLIENT_ID
    label: "Google OAuth client ID"
    description: "Your own Google Cloud OAuth client (type Desktop app) for Gmail. Then run `hermes auth add email-drafts:google` once."
  google_client_secret:
    type: secret
    env: EMAIL_DRAFTS_GOOGLE_CLIENT_SECRET
    label: "Google OAuth client secret"
  smtp_host:
    type: str
    default: ""
    label: "SMTP host"
  smtp_port:
    type: int
    default: 587
    label: "SMTP port"
  smtp_security:
    type: str
    choices: [starttls, ssl]
    default: starttls
    label: "SMTP security"
    description: "starttls (port 587) or ssl (port 465). Plain-text SMTP is not offered."
  smtp_username:
    type: str
    default: ""
    label: "SMTP username"
  smtp_password:
    type: secret
    env: EMAIL_DRAFTS_SMTP_PASSWORD
    label: "SMTP password"
    description: "Stored by Hermes like a provider key; read with the profile's secret scope."
