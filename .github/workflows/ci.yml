name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Syntax-check plugins
        run: |
          node --check computer-viewer/plugin.js
          node --check grokbot-override/plugin.js

      # Whole-repo privacy guard: no private hosts, addresses, home folders,
      # workspace ids, business or bot names in any tracked text file.
      - name: Privacy guard
        run: node --test tests/privacy-guard.test.mjs

      - name: Plugin unit tests
        run: node --test computer-viewer/plugin.test.mjs grokbot-override/test/*.test.mjs

      # The committed single-file plugin.js must match its src/, it must load
      # and run the way Hermes's runtime loader runs it (test/loader-*.test.mjs:
      # shim modules, production React, a DOM), and the UI must server-render (test/render.test.mjs and the app-layer tests in
      # test/review-r2-app.test.mjs and test/review-r3-app.test.mjs need the dev
      # dependencies).
      - name: Grokbot Override build is current and renders
        run: |
          npm ci --prefix grokbot-override --no-audit --no-fund
          npm run --prefix grokbot-override check
          node --test grokbot-override/test/*.test.mjs

      - name: Install PyYAML (the orgo-computer config writer needs it)
        run: python3 -m pip install --disable-pip-version-check --quiet pyyaml

      - name: Orgo computer plugin tests
        run: python3 -m unittest discover -s computer-viewer/agent-plugin/orgo-computer/tests -p 'test_*.py'

      - name: Texting-style tests
        run: python3 -m unittest discover -s texting-style/tests -p 'test_*.py'

      # -n 1: without it xargs passes every later path as an ARGUMENT to the
      # first script, so only one file was ever parsed.
      - name: Shell syntax
        run: find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0 -n 1 bash -n

      - name: HD agent tests
        run: python3 computer-viewer/tests/test-hiperf-agent.py

      - name: Host-script bind tests
        run: bash computer-viewer/tests/test-bind.sh

      - name: Agent-plugin installer tests
        run: bash computer-viewer/tests/test-install-agent-plugin.sh

      - name: ASCII check (agent plugin)
        run: |
          python3 -c '
          import sys
          from pathlib import Path
          root = Path("computer-viewer/agent-plugin")
          bad = [p for p in root.rglob("*.py") if any(b > 127 for b in p.read_bytes())]
          if bad:
              print("non-ASCII bytes in:")
              for p in bad:
                  print(" ", p)
              sys.exit(1)
          print("ASCII OK")
          '

      - name: Manifest check
        run: bash scripts/make-manifest.sh --check

      - name: Installer tests
        run: bash tests/test-install.sh

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: PowerShell syntax
        shell: pwsh
        run: |
          $failed = $false
          $files = Get-ChildItem -Path . -Recurse -Filter '*.ps1' |
            Where-Object { $_.FullName -notmatch '\\\.git\\' }
          if (-not $files) { Write-Host 'no .ps1 files found'; exit 1 }
          foreach ($f in $files) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors -and $errors.Count -gt 0) {
              $failed = $true
              Write-Host "FAIL $($f.FullName)"
              foreach ($e in $errors) {
                Write-Host "  line $($e.Extent.StartLineNumber): $($e.Message)"
              }
            } else {
              Write-Host "OK   $($f.FullName)"
            }
          }
          if ($failed) { exit 1 }

      - name: HD agent tests
        run: python3 computer-viewer/tests/test-hiperf-agent.py
