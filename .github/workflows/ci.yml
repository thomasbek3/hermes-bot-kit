name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Syntax-check plugins
        run: |
          node --check computer-viewer/plugin.js
          node --check grokbot-override/plugin.js

      # Whole-repo privacy guard: no private hosts, addresses, home folders,
      # workspace ids, business or bot names in any tracked text file.
      - name: Privacy guard
        run: node --test tests/privacy-guard.test.mjs

      - name: Plugin unit tests
        run: node --test computer-viewer/plugin.test.mjs grokbot-override/test/*.test.mjs

      # The committed single-file plugin.js must match its src/, it must load
      # and run the way Hermes's runtime loader runs it (test/loader-*.test.mjs:
      # shim modules, production React, a DOM), and the UI must server-render (test/render.test.mjs and the app-layer tests in
      # test/review-r2-app.test.mjs and test/review-r3-app.test.mjs need the dev
      # dependencies).
      - name: Grokbot Override build is current and renders
        run: |
          npm ci --prefix grokbot-override --no-audit --no-fund
          npm run --prefix grokbot-override check
          node --test grokbot-override/test/*.test.mjs

      - name: Texting-style tests
        run: python3 -m unittest discover -s texting-style/tests -p 'test_*.py'

      # A fake composio CLI and fake Gmail and SMTP backends: no email is sent.
      - name: Email-drafts tests
        run: python3 -m unittest discover -s email-drafts/tests -p 'test_*.py'

      # A fake ssh and a fake driver: nothing leaves the runner. The tests that need a Hermes
      # checkout (the private-import contract, the backend on Hermes's real session) skip here;
      # run them locally with Hermes's venv (remote-cua/README.md). PyYAML: the route fixtures and the
      # standalone CLI read config.yaml (Hermes's venv has it; a clean runner does not).
      - name: remote-cua tests
        run: |
          python3 -m pip install --disable-pip-version-check --quiet pytest fastapi httpx pyyaml
          python3 -m pytest -p no:cacheprovider -q remote-cua/tests

      # -n 1: without it xargs passes every later path as an ARGUMENT to the
      # first script, so only one file was ever parsed.
      - name: Shell syntax
        run: find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0 -n 1 bash -n

      - name: Windows installer pure-function tests
        shell: pwsh
        run: pwsh -NoProfile -NonInteractive -File computer-viewer/tests/test-windows-pure.ps1

      - name: HD agent tests
        run: python3 computer-viewer/tests/test-hiperf-agent.py

      - name: Host-script bind tests
        run: bash computer-viewer/tests/test-bind.sh

      - name: Linux X11 setup test (shimmed x11vnc/systemctl, no network)
        run: bash computer-viewer/tests/test-linux-x11.sh

      - name: Retired-plugin remover tests
        run: bash computer-viewer/tests/test-remove-orgo-computer.sh

      - name: Manifest check
        run: bash scripts/make-manifest.sh --check

      - name: Installer tests
        run: bash tests/test-install.sh

      # Throwaway Hermes homes and a fake app; never the runner's own. The fix
      # lines are parsed under bash and zsh, so Linux needs zsh.
      - name: Doctor tests
        run: |
          if [ "$RUNNER_OS" = Linux ] && ! command -v zsh >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq zsh
          fi
          bash tests/test-doctor.sh

      # The runbook blocks run under bash and zsh (macOS's default shell).
      - name: AGENTS.md runbook commands (offline, fake curl; bash and zsh)
        run: |
          if [ "$RUNNER_OS" = Linux ] && ! command -v zsh >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq zsh
          fi
          bash tests/test-agents-runbook.sh

      - name: Release pins
        run: bash tests/test-release-pins.sh

      - name: No stale shortcut or switch instructions
        run: node --test tests/stale-instructions.test.mjs

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: PowerShell syntax
        shell: pwsh
        run: |
          $failed = $false
          $files = Get-ChildItem -Path . -Recurse -Filter '*.ps1' |
            Where-Object { $_.FullName -notmatch '\\\.git\\' }
          if (-not $files) { Write-Host 'no .ps1 files found'; exit 1 }
          foreach ($f in $files) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors -and $errors.Count -gt 0) {
              $failed = $true
              Write-Host "FAIL $($f.FullName)"
              foreach ($e in $errors) {
                Write-Host "  line $($e.Extent.StartLineNumber): $($e.Message)"
              }
            } else {
              Write-Host "OK   $($f.FullName)"
            }
          }
          if ($failed) { exit 1 }

      # The README's Windows check block, as written, against a source-zip copy
      # (LF, as GitHub's zips are) in a throwaway %LOCALAPPDATA%, then through
      # HERMES_HOME pointing at a profile (Desktop uses its parent).
      - name: README Windows verify step
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'src.zip'
          git -c core.autocrlf=false archive --format=zip -o $zip HEAD
          $src = Join-Path $env:RUNNER_TEMP 'src'
          Expand-Archive $zip $src
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'lad'
          $d = "$env:LOCALAPPDATA\hermes\desktop-plugins"
          New-Item -ItemType Directory -Force "$d\grokbot-override" | Out-Null
          Copy-Item -Recurse "$src\computer-viewer" $d
          Copy-Item "$src\grokbot-override\plugin.js" "$d\grokbot-override\"
          Copy-Item "$src\MANIFEST.sha256" $d
          $m = [regex]::Match((Get-Content README.md -Raw), '(?s)<!-- windows-check:[^>]*-->\s*```powershell\r?\n(.*?)```')
          if (-not $m.Success) { Write-Host 'no windows-check block in README.md'; exit 1 }
          $check = $m.Groups[1].Value
          Remove-Item Env:HERMES_HOME -ErrorAction SilentlyContinue
          if ((Get-ItemProperty HKCU:\Environment -ErrorAction SilentlyContinue).HERMES_HOME) { Write-Host 'runner has a registry HERMES_HOME'; exit 1 }
          $out = @(Invoke-Expression $check)
          if (($out -notcontains 'checked') -or ($out -match '^FIX') -or ($out -notcontains "home: $env:LOCALAPPDATA\hermes")) { $out; exit 1 }
          $env:HERMES_HOME = "$env:LOCALAPPDATA\hermes\profiles\x"
          $out = @(Invoke-Expression $check)
          if (($out -notcontains 'checked') -or ($out -notcontains "home: $env:LOCALAPPDATA\hermes")) { $out; exit 1 }
          Remove-Item Env:HERMES_HOME
          Remove-Item "$d\computer-viewer\vendor\novnc-rfb.mjs"
          $out = @(Invoke-Expression $check)
          if (-not ($out -match 'FIX: copy computer-viewer/vendor/novnc-rfb.mjs again')) { $out; exit 1 }
          Write-Host 'README Windows verify step OK'

      - name: Windows installer pure-function tests
        shell: pwsh
        run: pwsh -NoProfile -NonInteractive -File computer-viewer/tests/test-windows-pure.ps1

      - name: HD agent tests
        run: python3 computer-viewer/tests/test-hiperf-agent.py
