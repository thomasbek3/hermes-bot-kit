name: Hermes source compatibility
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * 1'
permissions:
  contents: read
jobs:
  source-contracts:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ref: [v0.23.0, main]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: kit
          persist-credentials: false
      # Upstream is only read as text by check-hermes-compat.py: never
      # import, pip install or run anything from upstream/ in this job.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          repository: NousResearch/hermes-agent
          ref: ${{ matrix.ref }}
          path: upstream
          sparse-checkout: |
            apps/desktop/src
            /hermes_cli/plugins*.py
            tools/bot_mode_probe.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python3 kit/scripts/check-hermes-compat.py upstream
