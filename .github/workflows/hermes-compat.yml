name: Hermes source compatibility
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * 1'
jobs:
  source-contracts:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ref: [v0.23.0, main]
    steps:
      - uses: actions/checkout@v4
        with:
          path: kit
      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ matrix.ref }}
          path: upstream
          sparse-checkout: |
            apps/desktop/src
            hermes_cli/plugins.py
            tools/bot_mode_probe.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 kit/scripts/check-hermes-compat.py upstream
