name: Feature request
description: Suggest something the kit should do.
title: "Idea: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The job you want done, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How you picture it working. Screenshots or sketches welcome.
    validations:
      required: true
  - type: dropdown
    id: plugin
    attributes:
      label: Which part of the kit
      options:
        - Grokbot Override (Bots tab)
        - Computer pane
        - Slack add-ons
        - texting-style
        - email-drafts
        - remote-cua
        - Installer or docs
        - Something new
    validations:
      required: false
